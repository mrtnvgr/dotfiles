name: "Build"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: mrtnvgr
        authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

    - name: Build custom packages
      env:
        NIXPKGS_ALLOW_UNFREE: 1
      run: |
        # shellcheck disable=SC2016
        nix build --impure --no-link --print-out-paths --expr '
          let
            flake = builtins.getFlake (toString ./.);
            pkgs = flake.inputs.nixpkgs.legacyPackages.${builtins.currentSystem};
            custom = import ./pkgs { inherit pkgs; };
            cachable = x:
              pkgs.lib.isDerivation x
              && !(x.meta.broken or false)
              && !(x.preferLocalBuild or false)
              && (x.allowSubstitutes or true);
          in
          pkgs.linkFarmFromDrvs "ci-build-all" (builtins.filter cachable (builtins.attrValues custom))
        '

    - name: Trigger ISO build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run build_iso.yml --ref main
