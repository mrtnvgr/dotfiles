name: "Update"

on:
  schedule:
    - cron: "30 5 * * 0" # every Sunday at 5:30
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      NIX_PATH: nixpkgs=flake:nixpkgs

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Recent Nix versions fetch flake sources lazily, so `nix flake metadata`
    # can return store paths that were never materialized. nix-update relies
    # on those paths and fails (Mic92/nix-update#687), so use Lix.
    - name: Install Lix
      uses: samueldr/lix-gha-installer-action@v2026-06-15
      with:
        extra_nix_config: |
          accept-flake-config = true
          experimental-features = nix-command flakes

    - name: Install nix-update
      run: |
        echo "$(nix build --no-link --print-out-paths nixpkgs#nix-update)/bin" >> "$GITHUB_PATH"

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Update packages
      id: update
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NIXPKGS_ALLOW_UNFREE: 1
      run: |
        failed=0
        failed_packages=()

        nix eval --raw --impure .#packages.x86_64-linux --apply '
          pkgs: builtins.concatStringsSep "\n" (
            builtins.filter
              (name: (pkgs.${name}.passthru.updateScript or null) != null)
              (builtins.attrNames pkgs)
          )
        ' > "$RUNNER_TEMP/packages.txt"

        mapfile -t packages < "$RUNNER_TEMP/packages.txt"

        if [ "${#packages[@]}" -eq 0 ]; then
          echo "No updatable packages found" >&2
          exit 1
        fi

        for pkg in "${packages[@]}"; do
          [ -n "$pkg" ] || continue
          echo "::group::nix-update $pkg"

          # Upstream APIs and GitHub occasionally time out or reset
          # connections. Retry a few times instead of failing the whole run.
          updated=0
          for attempt in 1 2 3; do
            if nix-update --flake --use-update-script --commit "$pkg"; then
              updated=1
              break
            fi

            echo "::warning::nix-update $pkg failed (attempt $attempt/3)"
            # Discard partially written changes before trying again.
            git reset --hard --quiet HEAD
            git clean -fdq
            sleep $((attempt * 15))
          done

          if [ "$updated" -eq 0 ]; then
            failed=1
            failed_packages+=("$pkg")
            echo "::error::nix-update failed for $pkg after 3 attempts"
          fi

          echo "::endgroup::"
        done

        if [ "${#failed_packages[@]}" -ne 0 ]; then
          printf 'Failed packages: %s\n' "${failed_packages[*]}" >&2
        fi

        echo "failed=$failed" >> "$GITHUB_OUTPUT"

    - name: Push changes
      id: push
      run: |
        for attempt in 1 2 3; do
          git fetch origin main

          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rebase origin/main

          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git push origin HEAD:main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        echo "Failed to push changes after 3 attempts" >&2
        exit 1

    - name: Trigger build
      if: steps.push.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run build.yml --ref main

    - name: Fail if any package update failed
      if: always() && steps.update.outputs.failed == '1'
      run: |
        echo "Some packages failed to update, see the log above." >&2
        exit 1
